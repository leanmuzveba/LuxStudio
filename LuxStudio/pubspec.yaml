name: luxstudio
description: >
  LuxStudio — an AI-assisted long-form-to-social video editor. Import a raw
  recording, let AI strip silence, auto-caption, and surface short-form
  clip candidates, then batch-export ready-to-share vertical MP4s with
  branding and social copy.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  file_picker: ^12.1.0
  video_player: ^2.14.0
  share_plus: ^13.3.0
  uuid: ^4.6.0
  image_picker: ^1.2.3
  google_fonts: ^8.2.1
  http: ^1.2.0
  shared_preferences: ^2.2.0
  phosphor_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
